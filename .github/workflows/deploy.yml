name: Deploy

on:
  push:
    branches: ["master"]

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/go.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump version
        id: bump
        run: |
          git config --global user.email "ci@gochain.io"
          git config --global user.name "CI"
          version_file="params/version.go"
          # Bump version, patch by default - also checks if previous commit message contains `[bump X]`, and if so, bumps the appropriate semver number - https://github.com/treeder/dockers/tree/master/bump
          docker run --rm -v $PWD:/app -w /app treeder/bump --filename $version_file "$(git log -1 --pretty=%B)"
          version=$(grep -m1 -Eo "[0-9]+\.[0-9]+\.[0-9]+" $version_file)
          echo "Version: $version"
          git add -u
          git commit -m "gochain: $version release [skip ci]"
          git tag -f -a "v$version" -m "version $version"
          git push
          git push origin v$version
          echo "version=$version" >> $GITHUB_OUTPUT
          major=$(echo "$version" | cut -d. -f1)
          major_minor=$(echo "$version" | cut -d. -f1,2)
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "major_minor=$major_minor" >> $GITHUB_OUTPUT
      - name: Build and push
        id: docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/gochain/gochain:${{ github.sha }},ghcr.io/gochain/gochain:${{ steps.bump.outputs.version }},ghcr.io/gochain/gochain:latest,ghcr.io/gochain/gochain:${{ steps.bump.outputs.major }},ghcr.io/gochain/gochain:${{ steps.bump.outputs.major_minor }}
